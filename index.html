<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Brief 2026-09-04</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --paper:  #F2F4F5;
  --card:   #FFFFFF;
  --ink:    #10161B;
  --muted:  #5E6B75;
  --rule:   #DDE2E5;
  --signal: #2B4ACB;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:  #0B0E11;
    --card:   #161C21;
    --ink:    #E8ECEF;
    --muted:  #94A2AC;
    --rule:   #262F36;
    --signal: #8FA5FF;
  }
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 2rem 0.875rem 4rem;
  background: var(--paper);
  color: var(--ink);
  font-family: Newsreader, Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.5;
}

.wrap { max-width: 34rem; margin: 0 auto; }

.masthead { margin: 0 0.25rem 1.5rem; }

.masthead h1 {
  font-size: 1.625rem;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin: 0 0 0.375rem;
}

.stamp {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

.stamp .sep { opacity: 0.4; padding: 0 0.4em; }

.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 0.875rem;
}

.shot {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: var(--rule);
  border-bottom: 1px solid var(--rule);
}

.body { padding: 1rem 1.125rem 1.125rem; }

.source {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.625rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 0.5rem;
}

.card h2 {
  font-size: 1.125rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.008em;
  margin: 0 0 0.5rem;
}

.what {
  font-size: 0.9375rem;
  line-height: 1.55;
  color: var(--muted);
  margin: 0 0 1rem;
}

.sowhat {
  font-size: 1.0625rem;
  line-height: 1.5;
  margin: 0;
  padding-left: 0.875rem;
  border-left: 2px solid var(--signal);
}

.sowhat b {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--signal);
  display: block;
  margin-bottom: 0.3125rem;
}

.card a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.source a { text-decoration: none; }
.source a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

.foot {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.6875rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-top: 2rem;
  text-align: center;
}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
<h1>Your brief</h1>
<p class="stamp">2026-09-04<span class="sep">/</span>0 items</p>
</header>
<article class="card">
<div class="body">
<p class="what">No new developments across the standing threads.</p>
</div></article>
<p class="foot">Written by an agent. Archive in meridian-status.</p>
</div>
</body>
</html>
